[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-llm-eval"
version = "0.1.0"
description = "A benchmarking framework for evaluating LLM performance on clinical reasoning tasks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sugumaran Balasubramaniyan", email = "bsugumaran@hotmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "mistralai>=1.0.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "streamlit>=1.35.0",
    "datasets>=2.18.0",
    "pyyaml>=6.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
clinical-llm-eval = "clinical_llm_eval.eval_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clinical_llm_eval*"]
exclude = ["tests*", "reports/output*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
