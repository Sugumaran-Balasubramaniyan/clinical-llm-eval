name: PR Benchmark Bot

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fast offline PR benchmark
        run: python -m clinical_llm_eval.eval_pipeline --dataset sample_medqa --models ollama/biomistral --n_samples 3 --output_dir reports/output || true

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-benchmark-reports
          path: reports/output/
